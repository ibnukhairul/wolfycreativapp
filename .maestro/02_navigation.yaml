appId: com.wolfycreativ.wolfycreativ_mobile
---
# ==============================================================================
# FLOW 2: NAVIGASI ANTAR MENU APLIKASI
# Mapping UAT: TC-DASH-004 (Bottom Navigation Bar) & UAT-13 (Responsivitas Menu)
# ==============================================================================

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 10000

# 1. Navigasi ke Halaman Order (Tab 'Order' di Bottom Navigation Bar)
# Menggunakan regex exact ^Order$ agar tidak mengklik tombol chip "+ Order Baru" di atas
- tapOn:
    point: "30%, 95%"
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 8000
- assertVisible: "Daftar Order"
- takeScreenshot: screenshots/02_nav_01_order

# 2. Navigasi ke Halaman Customer (Tab 'Customer' di Bottom Navigation Bar)
- tapOn:
    point: "50%, 95%"
- extendedWaitUntil:
    visible: "Customer"
    timeout: 8000
- assertVisible: "Customer"
- takeScreenshot: screenshots/02_nav_02_customer

# 3. Navigasi ke Halaman Kalender (Tab 'Kalender' di Bottom Navigation Bar)
- tapOn:
    point: "75%, 95%"
- extendedWaitUntil:
    visible: "Kalender Deadline"
    timeout: 8000
- assertVisible: "Kalender Deadline"
- takeScreenshot: screenshots/02_nav_03_kalender

# 4. Navigasi ke Menu Lainnya (Tab 'Lainnya' - Bottom Sheet)
- tapOn:
    point: "95%, 95%"
- extendedWaitUntil:
    visible: "Menu Lainnya"
    timeout: 6000
- assertVisible: "Menu Lainnya"
- assertVisible: "Layanan"
- assertVisible: "Keuangan Bisnis"
- assertVisible: "Analitik"
- assertVisible: "Keuangan Pribadi"
- takeScreenshot: screenshots/02_nav_04_menu_lainnya

# 5. Kembali ke Halaman Beranda
- back
- tapOn:
    point: "5%, 95%"
- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 6000
- assertVisible: "Order Baru"
- takeScreenshot: screenshots/02_nav_05_back_beranda

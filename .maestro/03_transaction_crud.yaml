appId: com.wolfycreativ.wolfycreativ_mobile
---
# ==============================================================================
# FLOW 3: ALUR TRANSAKSI & CRUD (FORM PEMBUATAN ORDER BARU)
# Mapping UAT: TC-ORD-004 (Tambah Pesanan Baru) & UAT-04 (Buat Pesanan Baru)
# ==============================================================================

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 10000

# 1. Buka Tab Menu Order di Bottom Navigation Bar
- tapOn:
    point: "30%, 95%"
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 8000
- assertVisible: "Daftar Order"

# 2. Buka Form Pembuatan Order Baru via FAB ("Order Baru")
- tapOn: "Order Baru"
- extendedWaitUntil:
    visible: "Buat Order"
    timeout: 8000

# 3. Assertion Komponen Utama Form Terbuka Lengkap
- assertVisible: "Order Baru"
- assertVisible: "Customer"
- assertVisible: "Layanan Master"
- assertVisible: "Buat Order"
- takeScreenshot: screenshots/03_form_order_baru_loaded

# 4. Kembali ke Daftar Order
- back
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 6000
- assertVisible: "Daftar Order"
- takeScreenshot: screenshots/03_crud_verified

# 5. Kembali ke Halaman Beranda
- tapOn:
    point: "5%, 95%"
- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 6000
- assertVisible: "Order Baru"

appId: com.wolfycreativ.wolfycreativ_mobile
---
# ==============================================================================
# FLOW 4: VALIDASI KESALAHAN & PENGUJIAN NEGATIF LENGKAP (NEGATIVE TESTING)
# Mapping UAT: TC-AUTH-004, TC-ORD-005, TC-CUST-002, UAT-02 (Pesan Kesalahan)
#
# Skenario Lengkap:
#   0. Logout dari aplikasi untuk menuju halaman Login
#   1. Pengujian Form Login:
#      - Skenario 1 (Salah): Form kosong & kredensial salah (Invalid credentials)
#      - Skenario 2 (Berhasil): Login dengan kredensial valid dev@dev.id / dev234
#   2. Validasi Form Order Baru:
#      - Submit form kosong → validasi Layanan & Harga wajib diisi
#      - Pilih Layanan tanpa Customer → snackbar "Silakan pilih customer terlebih dahulu"
#      - Kosongkan Harga → validasi "Harga wajib diisi"
#   3. Pencarian Order (Empty State / Not Found):
#      - Cari keyword tidak ada → tampilan kosong "Tidak ada order ditemukan"
#   4. Validasi Catat Pembayaran & Konfirmasi Dialog:
#      - Input nominal 0 → snackbar "Nominal harus lebih dari 0"
#      - Status Batal → klik "Tidak" (order tidak dibatalkan)
#      - Hapus Order → klik "Batal" (order tidak dihapus)
#   5. Validasi Customer:
#      - Simpan customer tanpa nama → ditolak (dialog tetap terbuka)
#      - Cari customer tidak ada → tampilan kosong "Belum ada customer ditemukan"
#   6. Kembali ke Beranda (Selesai)
# ==============================================================================

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 10000

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  BAGIAN 0: LOGOUT UNTUK MENUJU KE HALAMAN LOGIN                     ║
# ╚════════════════════════════════════════════════════════════════════════╝

# 0.1 Buka Menu Lainnya via Bottom Navigation Bar
- tapOn:
    point: "95%, 95%"
- extendedWaitUntil:
    visible: "Menu Lainnya"
    timeout: 6000
- assertVisible: "Menu Lainnya"
- assertVisible: "Keluar"
- takeScreenshot: screenshots/04_00_menu_lainnya

# 0.2 Klik 'Keluar' untuk Logout
- tapOn: "Keluar"
- extendedWaitUntil:
    visible: "WolfyCreativ"
    timeout: 10000
- assertVisible: "WolfyCreativ"
- assertVisible: "Masuk ke panel operasional"
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Masuk"
- takeScreenshot: screenshots/04_00_logout_success

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  BAGIAN 1: PENGUJIAN LOGIN (SKENARIO SALAH LALU BERHASIL)           ║
# ╚════════════════════════════════════════════════════════════════════════╝

# 1.1 Skenario 1 (Salah) - Validasi Field Kosong
- tapOn: "Masuk"
- extendedWaitUntil:
    visible: "Email wajib diisi"
    timeout: 5000
- assertVisible: "Email wajib diisi"
- assertVisible: "Password wajib diisi"
- takeScreenshot: screenshots/04_01a_login_empty_error

# 1.2 Skenario 1 (Salah) - Input Kredensial Salah
- tapOn:
    below: "Email"
    above: "Password"
- inputText: "a@dev.id"

- tapOn:
    below: "Password"
    above: "Masuk"
- inputText: "passwordsalah"
- hideKeyboard

- takeScreenshot: screenshots/04_01b_login_wrong_credentials
- tapOn: "Masuk"

# Verifikasi pesan error dari backend Supabase
- extendedWaitUntil:
    visible: ".*[Ii]nvalid.*"
    timeout: 10000
- assertVisible: ".*[Ii]nvalid.*"
- takeScreenshot: screenshots/04_01c_login_failed_error

# 1.3 Skenario 2 (Berhasil) - Input Kredensial Valid & Masuk
- tapOn:
    below: "Email"
    above: "Password"
- eraseText: 30
- inputText: "user@gmail.com"

- tapOn:
    below: "Password"
    above: "Masuk"
- eraseText: 30
- inputText: "user123"
- hideKeyboard
- takeScreenshot: screenshots/04_02a_login_valid_filled
- tapOn: "Masuk"

# Verifikasi Berhasil Masuk ke Beranda
- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 15000
- assertVisible: "Order Baru"
- assertVisible: "To Do Hari Ini"
- takeScreenshot: screenshots/04_02b_login_success_beranda

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  BAGIAN 2: VALIDASI FORM ORDER BARU                                 ║
# ╚════════════════════════════════════════════════════════════════════════╝

# 2.1 Menuju ke Halaman Order via Tab 'Order' di Bottom Navigation Bar
- tapOn:
    point: "30%, 95%"
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 8000
- assertVisible: "Daftar Order"

# 2.2 Buka Form Order Baru via FAB ("Order Baru")
- tapOn: "Order Baru"
- extendedWaitUntil:
    visible: "Buat Order"
    timeout: 8000
- assertVisible: "Order Baru"
- assertVisible: "Buat Order"
- takeScreenshot: screenshots/04_21_form_order_empty

# 2.3 Uji Validasi Form Kosong: Tekan "Buat Order" saat form masih kosong
- scrollUntilVisible:
    element: "Buat Order"
    direction: DOWN
    timeout: 3000
- tapOn: "Buat Order"
- extendedWaitUntil:
    visible: ".*Layanan wajib dipilih.*"
    timeout: 5000
- assertVisible: ".*Layanan wajib dipilih.*"
- assertVisible: ".*Harga wajib diisi.*"
- takeScreenshot: screenshots/04_22_validation_required_fields

# 2.4 Uji Validasi Customer Kosong: Pilih Layanan tapi belum memilih Customer
- scrollUntilVisible:
    element: "Layanan Master"
    direction: UP
    timeout: 3000
- tapOn: 
    below: "Layanan Master"
- extendedWaitUntil:
    visible: ".*Jersey.*"
    timeout: 5000
- tapOn:
    text: ".*Jersey.*"
    index: 0

# Tekan "Buat Order" tanpa memilih Customer
- scrollUntilVisible:
    element: "Buat Order"
    direction: DOWN
    timeout: 3000
- tapOn: "Buat Order"
- extendedWaitUntil:
    visible: ".*pilih customer.*"
    timeout: 5000
- assertVisible: ".*pilih customer.*"
- takeScreenshot: screenshots/04_23_validation_no_customer_snackbar

# 2.5 Uji Validasi Harga Kosong: Hapus nilai harga setelah auto-fill layanan
- scrollUntilVisible:
    element: "Harga Order (Rp)"
    direction: UP
    timeout: 3000
- tapOn:
    below: "Harga Order (Rp)"
    above: "Tanggal Order"
- longPressOn:
    below: "Harga Order (Rp)"
    above: "Tanggal Order"
- eraseText: 20
- hideKeyboard
- scrollUntilVisible:
    element: "Buat Order"
    direction: DOWN
    timeout: 3000
- tapOn: "Buat Order"
- extendedWaitUntil:
    visible: ".*Harga wajib diisi.*"
    timeout: 5000
- assertVisible: ".*Harga wajib diisi.*"
- takeScreenshot: screenshots/04_24_validation_price_cleared

# 2.6 Kembali dari Form Order ke Daftar Order
- back
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 6000
- assertVisible: "Daftar Order"

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  BAGIAN 3: VALIDASI PENCARIAN ORDER (EMPTY STATE / NOT FOUND)       ║
# ╚════════════════════════════════════════════════════════════════════════╝

# 3.1 Cari order dengan kata kunci yang tidak ada di sistem
- tapOn: "Cari invoice, customer, layanan..."
- inputText: "DATA_TIDAK_VALID_XYZ"
- extendedWaitUntil:
    visible: ".*Tidak ada order ditemukan.*"
    timeout: 5000
- assertVisible: ".*Tidak ada order ditemukan.*"
- assertVisible: ".*Coba ubah filter atau kata kunci pencarian.*"
- takeScreenshot: screenshots/04_31_order_search_not_found

# 3.2 Bersihkan pencarian untuk mengembalikan daftar order
- eraseText: 25
- hideKeyboard

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  BAGIAN 4: VALIDASI CATAT PEMBAYARAN (NOMINAL TIDAK VALID)          ║
# ╚════════════════════════════════════════════════════════════════════════╝

# 4.1 Buka salah satu order dari daftar
- tapOn:
    text: ".*WC.*"
    index: 0
- extendedWaitUntil:
    visible: "Detail Order"
    timeout: 8000
- assertVisible: "Detail Order"

# 4.2 Buka modal Catat Pembayaran
- scrollUntilVisible:
    element: ".*Catat Pembayaran.*"
    direction: DOWN
    timeout: 5000
- tapOn: ".*Catat Pembayaran.*"
- extendedWaitUntil:
    visible: "Catat Pembayaran Order"
    timeout: 5000
- assertVisible: "Catat Pembayaran Order"

# 4.3 Masukkan nominal tidak valid (0)
- inputText: "0"
- hideKeyboard
- tapOn: "Simpan Pembayaran"
- back

# Harapan: Muncul snackbar validasi 'Nominal harus lebih dari 0'
- extendedWaitUntil:
    visible: ".*Nominal harus lebih dari 0.*"
    timeout: 5000
- assertVisible: ".*Nominal harus lebih dari 0.*"
- takeScreenshot: screenshots/04_41_validation_zero_payment

# Tutup modal pembayaran


# 4.4 Uji Dialog Batal Order: Tekan Batal lalu pilih "Tidak"
- scrollUntilVisible:
    element: "Ubah Status Pengerjaan"
    direction: UP
    timeout: 5000
- tapOn: "Batal"
- extendedWaitUntil:
    visible: "Batalkan Order?"
    timeout: 5000
- assertVisible: "Batalkan Order?"
- tapOn: "Tidak"
- takeScreenshot: screenshots/04_42_cancel_order_declined

# 4.5 Uji Dialog Hapus Order: Tekan Hapus Order di AppBar lalu pilih "Batal"
- tapOn: "Hapus Order"
- extendedWaitUntil:
    visible: "Hapus Order?"
    timeout: 5000
- assertVisible: "Hapus Order?"
- tapOn: "Batal"
- takeScreenshot: screenshots/04_43_delete_order_declined

# 4.6 Kembali ke Daftar Order
- back
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 6000
- hideKeyboard

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  BAGIAN 5: VALIDASI CUSTOMER (SUBMIT KOSONG & SEARCH NOT FOUND)     ║
# ╚════════════════════════════════════════════════════════════════════════╝

# 5.1 Navigasi ke Tab Customer di Bottom Navigation Bar
- tapOn:
    point: "50%, 95%"
- extendedWaitUntil:
    visible: "Customer"
    timeout: 8000
- assertVisible: "Customer"

# 5.2 Uji Form Tambah Customer Baru: Simpan tanpa Nama Lengkap
- tapOn: "Customer Baru"
- extendedWaitUntil:
    visible: "Tambah Customer Baru"
    timeout: 5000
- assertVisible: "Tambah Customer Baru"

# Tekan Simpan langsung tanpa isi apapun
- tapOn: "Simpan"

# Harapan: Sistem menolak submit, dialog tetap terbuka
- assertVisible: "Tambah Customer Baru"
- takeScreenshot: screenshots/04_51_customer_empty_rejected

# Tutup dialog dengan tombol Batal
- tapOn: "Batal"

# 5.3 Uji Pencarian Customer Tidak Ada
- tapOn: "Cari customer, no WA, Instagram..."
- inputText: "DATA_TIDAK_VALID_XYZ"
- extendedWaitUntil:
    visible: ".*Belum ada customer ditemukan.*"
    timeout: 5000
- assertVisible: ".*Belum ada customer ditemukan.*"
- takeScreenshot: screenshots/04_52_customer_search_not_found

# Bersihkan search
- eraseText: 25
- hideKeyboard

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  BAGIAN 6: KEMBALI KE BERANDA (SELESAI)                             ║
# ╚════════════════════════════════════════════════════════════════════════╝

- tapOn:
    point: "5%, 95%"
- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 6000
- assertVisible: "Order Baru"
- takeScreenshot: screenshots/04_60_validation_all_passed

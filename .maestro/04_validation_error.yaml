appId: com.wolfycreativ.wolfycreativ_mobile
---
# ==============================================================================
# FLOW 4: VALIDASI KESALAHAN (NEGATIVE TESTING & FORM VALIDATION)
# Mapping UAT: TC-ORD-005 (Validasi Form Pesanan Baru) & UAT-02 (Pesan Kesalahan)
# ==============================================================================

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 10000

# 1. Menuju ke Halaman Order via Tab 'Order' di Bottom Navigation Bar
- tapOn:
    point: "30%, 95%"
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 8000
- assertVisible: "Daftar Order"

# 2. Buka Form Order Baru via FAB ("Order Baru")
- tapOn: "Order Baru"
- extendedWaitUntil:
    visible: "Buat Order"
    timeout: 8000

# 3. Trigger Validasi Kesalahan dengan Klik "Buat Order" saat form masih kosong
- tapOn: "Buat Order"

# 4. Assertion: Pesan Peringatan Validasi Muncul pada Layar
# (Aplikasi memunculkan snackbar: 'Silakan pilih customer terlebih dahulu')
- extendedWaitUntil:
    visible: ".*pilih customer.*"
    timeout: 5000
- assertVisible: ".*pilih customer.*"
- takeScreenshot: screenshots/04_validation_error_triggered

# 5. Kembali ke Layar Daftar Order lalu ke Beranda
- back
- extendedWaitUntil:
    visible: "Daftar Order"
    timeout: 6000
- assertVisible: "Daftar Order"

- tapOn:
    point: "5%, 95%"
- extendedWaitUntil:
    visible: "Order Baru"
    timeout: 6000
- assertVisible: "Order Baru"
